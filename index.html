<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar widget</title>
  <style>
    :root {
      --paper: #e7e7e5;
      --ink: #111111;
      --muted: rgba(17, 17, 17, .48);
      --edge: rgba(0, 0, 0, .08);
      --shadow: rgba(0, 0, 0, .17);
    }
    [data-mode="night"] {
      --paper: #373737;
      --ink: #e9e9e7;
      --muted: rgba(233, 233, 231, .55);
      --edge: rgba(255, 255, 255, .10);
      --shadow: rgba(0, 0, 0, .42);
    }
    * { box-sizing: border-box; }
    html, body, #calendarRoot {
      margin: 0; width: 100%; height: 100%; min-height: 100%;
      background: transparent !important; background-image: none !important; overflow: hidden;
    }
    body {
      display: grid; place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #calendarRoot {
      --scale: 1;
      display: grid; place-items: center; align-content: center;
      width: 100%; height: 100%;
    }
    .calendar {
      position: relative;
      display: grid;
      grid-template-rows: 39% 61%;
      width: calc(235px * var(--scale));
      height: calc(235px * var(--scale));
      overflow: hidden;
      border-radius: calc(10px * var(--scale));
      background: var(--paper);
      box-shadow: 0 calc(12px * var(--scale)) calc(20px * var(--scale)) var(--shadow),
        0 calc(2px * var(--scale)) calc(4px * var(--scale)) rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.3);
      color: var(--ink);
      transition: background-color .35s ease, color .35s ease, box-shadow .35s ease;
    }
    .calendar-head {
      position: relative;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 calc(13px * var(--scale)) calc(8px * var(--scale));
      background: var(--paper); color: var(--ink);
      transition: background-color .35s ease, color .35s ease;
      box-shadow: inset 0 calc(-1px * var(--scale)) 0 rgba(0,0,0,.08);
    }
    .month {
      position: relative; z-index: 1;
      font-size: calc(36px * var(--scale)); line-height: .92;
      font-weight: 800; letter-spacing: -.07em; text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }
    .rings {
      position: absolute; top: calc(9px * var(--scale)); left: 0; right: 0;
      display: flex; justify-content: space-around; padding: 0 calc(22px * var(--scale));
      pointer-events: none;
    }
    .ring {
      width: calc(22px * var(--scale)); height: calc(22px * var(--scale));
      border-radius: 50%; background: var(--paper); border: calc(1.5px * var(--scale)) solid var(--ink);
      box-shadow: 0 calc(1px * var(--scale)) calc(2px * var(--scale)) rgba(0,0,0,.1);
    }
    .mini-month {
      display: grid; grid-template-columns: repeat(7, calc(4px * var(--scale)));
      grid-auto-rows: calc(4px * var(--scale));
      align-content: end; gap: calc(4px * var(--scale));
      padding-bottom: calc(2px * var(--scale));
    }
    .dot {
      width: calc(4px * var(--scale)); height: calc(4px * var(--scale));
      border-radius: 50%; background: var(--ink); opacity: .35;
    }
    .dot.current { opacity: 1; box-shadow: 0 0 0 calc(1px * var(--scale)) var(--paper); }
    .calendar-face {
      position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 calc(8px * var(--scale)) calc(7px * var(--scale));
      background: var(--paper);
      transition: background-color .35s ease;
    }
    .date {
      color: var(--ink); font-size: calc(112px * var(--scale));
      font-weight: 800; line-height: .9; letter-spacing: -.07em;
      font-variant-numeric: tabular-nums;
    }
    .weekday {
      margin-top: calc(1px * var(--scale));
      color: var(--muted); font-size: calc(22px * var(--scale));
      line-height: 1.1; font-weight: 650; letter-spacing: -.035em;
    }
    @media (prefers-reduced-motion: no-preference) {
      .calendar { animation: settle .6s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes settle { from { opacity: .82; transform: translateY(calc(3px * var(--scale))); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <main id="calendarRoot" data-mode="day" aria-label="Calendar widget">
    <article class="calendar" aria-label="Current date">
      <header class="calendar-head">
        <div class="rings" aria-hidden="true"><i class="ring"></i><i class="ring"></i></div>
        <div class="month" id="monthName" aria-hidden="true">JAN</div>
        <div class="mini-month" id="miniMonth" aria-hidden="true"></div>
      </header>
      <section class="calendar-face">
        <div class="date" id="dateNumber">1</div>
        <div class="weekday" id="weekdayName">Monday</div>
      </section>
    </article>
  </main>
  <script>
    (() => {
      const root = document.getElementById('calendarRoot');
      const card = document.querySelector('.calendar');
      const monthNode = document.getElementById('monthName');
      const dateNode = document.getElementById('dateNumber');
      const weekdayNode = document.getElementById('weekdayName');
      const miniMonth = document.getElementById('miniMonth');
      const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');

      function setMode(night) {
        root.dataset.mode = night ? 'night' : 'day';
      }
      setMode(colorScheme.matches);
      colorScheme.addEventListener('change', event => setMode(event.matches));

      // Scale the calendar to the available widget box (235×235 at 1×).
      const resizeObserver = new ResizeObserver(([entry]) => {
        const { width, height } = entry.contentRect;
        if (!width || !height) return;
        const scale = Math.max(.25, Math.min(3, width / 235, height / 235));
        root.style.setProperty('--scale', scale.toFixed(3));
      });
      resizeObserver.observe(root);

      function updateDate() {
        const now = new Date();
        monthNode.textContent = new Intl.DateTimeFormat('en', { month: 'short' }).format(now).toUpperCase();
        dateNode.textContent = now.getDate();
        weekdayNode.textContent = new Intl.DateTimeFormat('en', { weekday: 'long' }).format(now);
        card.setAttribute('aria-label', new Intl.DateTimeFormat('en', {
          weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
        }).format(now));

        // A small, decorative 7-by-5 dot calendar, with today's position picked out.
        const todayIndex = (now.getDate() - 1) % 35;
        miniMonth.replaceChildren(...Array.from({ length: 35 }, (_, index) => {
          const dot = document.createElement('i');
          dot.className = index === todayIndex ? 'dot current' : 'dot';
          return dot;
        }));
      }
      updateDate();
      window.setInterval(updateDate, 60_000);
    })();
  </script>
</body>
</html>
